services:
  frontend:
    build:
      context: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend-core
      - ai-services

  backend-core:
    build:
      context: ./backend-core
    ports:
      - "8080:8080"

  ai-services:
    build:
      context: ./ai-services
    ports:
      - "8000:8000"
